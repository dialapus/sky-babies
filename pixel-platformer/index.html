<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14243d">
  <title>SKYLARK — The Lantern Trail</title>
  <style>
    :root {
      color-scheme:dark;
      --ink:#14243d;--mist:#b9dce5;--gold:#f7ce79;--rose:#f3a17e;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-right:env(safe-area-inset-right,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --safe-left:env(safe-area-inset-left,0px);
    }
    *{box-sizing:border-box}
    html,body{
      width:100%;height:100%;height:100dvh;margin:0;overflow:hidden;
      overscroll-behavior:none;touch-action:none;background:var(--ink);
      color:#eaf6f3;font-family:system-ui,Arial,sans-serif;
    }
    body{background:radial-gradient(ellipse at 54% 10%,#594d85 0,#273d61 47%,#111d34 90%)}
    .shell{
      width:100%;height:100%;height:100dvh;min-height:0;display:flex;
      flex-direction:column;align-items:center;justify-content:center;
      gap:12px;padding:16px 12px;overflow:hidden;
    }
    .ribbon{
      display:flex;align-items:center;justify-content:space-between;
      width:min(calc(100vw - 32px),1024px);
      font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a6c9d6;
      flex:none;
    }
    .ribbon strong{color:#ffd98c;font-weight:800;letter-spacing:.21em}
    .stage{
      display:block;position:relative;flex:none;min-width:0;min-height:0;
      width:min(calc(100vw - 48px),1024px,calc((100dvh - 125px) * 16 / 9));
      aspect-ratio:16 / 9;overflow:hidden;
    }
    canvas{
      display:block;width:100%;height:100%;aspect-ratio:auto;
      image-rendering:pixelated;image-rendering:crisp-edges;
      box-shadow:inset 0 0 0 1px #74949f;
      background:#203858;outline:none;touch-action:none;
    }
    .stage{box-shadow:0 0 0 3px #101a2c,0 0 0 6px #74949f,0 18px 50px #090e23aa}
    canvas:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
    .meta{
      display:flex;gap:24px;align-items:center;justify-content:center;
      flex:none;color:#a6c9d6;font-size:11px;letter-spacing:.05em;
    }
    .meta b{color:var(--gold)}
    .controls{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;width:min(98vw,800px);margin-top:4px;
      touch-action:none;user-select:none;-webkit-user-select:none;
    }
    .group{display:flex;gap:12px;align-items:center}
    .control{
      display:grid;place-items:center;width:76px;height:68px;
      border:2px solid #77a8b3;border-radius:12px;
      background:linear-gradient(160deg,#30496b,#1b2e4d);
      color:#f7e4ac;font-weight:900;font-size:26px;
      box-shadow:0 5px 0 #10223b;touch-action:none;
      user-select:none;-webkit-user-select:none;
      -webkit-tap-highlight-color:transparent;cursor:pointer;
    }
    .control:active,.control.pressed{
      transform:translateY(3px);background:#496a7c;box-shadow:0 2px 0 #10223b;
    }
    #jump{
      width:110px;font-size:15px;letter-spacing:.09em;
      background:linear-gradient(155deg,#c56e75,#924e78);
      border-color:#f2b58b;color:#fff3d6;
    }
    #pause{width:56px;height:52px;font-size:19px}
    button:focus-visible{outline:3px solid #fff3b5;outline-offset:3px}
    .touch-name{display:none}
    /* Keyboard/mouse users retain the original key map and no touch overlays. */
    @media (hover:hover) and (pointer:fine) {
      .controls,.touch-name{display:none}
    }
    /* On phones (including short landscape), use the ENTIRE visual viewport:
       the game draws under the controls, not beside or above them. */
    @media (pointer:coarse), (max-width:600px), (max-height:500px) and (orientation:landscape) {
      html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh}
      .shell{
        display:block;position:fixed;inset:0;width:100vw;
        height:100%;height:100dvh;padding:0;overflow:hidden;
      }
      .stage{
        position:absolute;inset:0;display:block;margin:0;
        width:100%;height:100%;height:100dvh;
        max-width:none;max-height:none;aspect-ratio:auto;
        box-shadow:none;overflow:hidden;
      }
      canvas{width:100%;height:100%;max-width:none;max-height:none;box-shadow:none}
      .ribbon,.meta,.touch-name{display:none}
      .controls{
        position:fixed;z-index:20;left:0;right:0;
        bottom:calc(12px + var(--safe-bottom));
        display:flex;align-items:flex-end;justify-content:space-between;
        width:100%;margin:0;
        padding-left:max(12px,var(--safe-left));
        padding-right:max(12px,var(--safe-right));
        pointer-events:none;
      }
      .group{gap:8px;pointer-events:auto}
      .control{
        width:70px;height:70px;min-width:44px;min-height:44px;
        border-radius:15px;border-width:2px;
        background:rgba(26,45,72,.76);
        box-shadow:0 3px 0 #10223bdd;
        font-size:24px;
        backdrop-filter:none;
      }
      #jump{
        width:90px;height:70px;font-size:13px;
        background:rgba(163,76,105,.85);
      }
      #pause{
        width:54px;height:54px;font-size:18px;
        align-self:flex-end;
      }
    }
    @media (max-width:359px) and (pointer:coarse),
           (max-width:359px) and (hover:none) {
      .controls{padding-left:max(8px,var(--safe-left));padding-right:max(8px,var(--safe-right))}
      .group{gap:5px}
      .control{width:58px;height:62px}
      #jump{width:76px;height:62px}
      #pause{width:46px;height:48px}
    }
    @media (max-height:500px) and (orientation:landscape) {
      .controls{bottom:calc(6px + var(--safe-bottom))}
      .control{width:62px;height:60px;font-size:21px}
      #jump{width:86px;height:62px;font-size:12px}
      #pause{width:50px;height:48px}
    }
    @media (hover:hover) and (pointer:fine) {
      .controls{display:none}
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="ribbon"><strong>SKYLARK</strong><span>THE LANTERN TRAIL · ORIGINAL PIXEL ADVENTURE</span><span id="sound-status">♪ ON</span></header>
    <div class="stage"><canvas id="game" width="256" height="144" tabindex="0" role="img" aria-label="Пиксельный платформер: движение стрелками, прыжок Пробел, пауза P"></canvas></div>
    <div class="meta"><span><b>MOVE</b> ← → / A D</span><span><b>JUMP</b> SPACE / ↑ / W / Z</span><span><b>PAUSE</b> P / ESC</span><span id="status">READY</span></div>
    <div class="controls" aria-label="Сенсорное управление">
      <div class="group">
        <button type="button" id="left" class="control" aria-label="Двигаться влево">◀</button>
        <button type="button" id="right" class="control" aria-label="Двигаться вправо">▶</button>
      </div>
      <div class="group">
        <button type="button" id="pause" class="control" aria-label="Пауза">Ⅱ</button>
        <button type="button" id="jump" class="control" aria-label="Прыжок">JUMP ↥</button>
      </div>
    </div>
    <p class="touch-name">Держите направление и прыжок одновременно. Поверните телефон для широкого обзора.</p>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
