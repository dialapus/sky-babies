<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#14243d">
  <title>SKYLARK — The Lantern Trail</title>
  <style>
    :root { color-scheme:dark; --ink:#14243d;--mist:#b9dce5;--gold:#f7ce79;--rose:#f3a17e; }
    * {box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:system-ui,Arial,sans-serif;color:#eaf6f3}
    body{background:radial-gradient(ellipse at 54% 10%,#594d85 0,#273d61 47%,#111d34 90%)}
    .shell{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:9px;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)}
    .ribbon{display:flex;align-items:center;justify-content:space-between;max-width:min(98vw,1110px);width:100%;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#a6c9d6}
    .ribbon strong{color:#ffd98c;font-weight:800;letter-spacing:.21em}
    .stage{width:min(98vw,1024px);display:flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:0}
    canvas{display:block;width:min(98vw,1024px);height:auto;aspect-ratio:16 / 9;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:0 0 0 3px #101a2c,0 0 0 6px #74949f,0 18px 50px #090e23aa;background:#203858;outline:none;touch-action:none}
    canvas:focus-visible{box-shadow:0 0 0 4px var(--gold),0 15px 60px #050714}
    .meta{display:flex;gap:24px;align-items:center;justify-content:center;color:#a6c9d6;font-size:11px;letter-spacing:.05em}
    .meta b{color:var(--gold)}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:12px;width:min(98vw,800px);margin-top:5px;touch-action:none;user-select:none;-webkit-user-select:none}
    .group{display:flex;gap:12px;align-items:center}
    .control{display:grid;place-items:center;width:76px;height:68px;border:2px solid #77a8b3;border-radius:12px;background:linear-gradient(160deg,#30496b,#1b2e4d);color:#f7e4ac;font-weight:900;font-size:26px;box-shadow:0 5px 0 #10223b;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:pointer}
    .control:active,.control.pressed{transform:translateY(3px);background:#496a7c;box-shadow:0 2px 0 #10223b}
    #jump{width:110px;font-size:15px;letter-spacing:.09em;background:linear-gradient(155deg,#c56e75,#924e78);border-color:#f2b58b;color:#fff3d6}
    #pause{width:56px;height:52px;font-size:19px}
    button:focus-visible{outline:3px solid #fff3b5}
    .touch-name{display:none}
    @media (hover:hover) and (pointer:fine) and (min-width:900px){.controls{max-width:600px}.control{width:63px;height:49px;font-size:20px}#jump{width:94px;font-size:12px}}
    @media(max-width:560px){.shell{justify-content:flex-start;gap:13px;padding-top:max(15px,env(safe-area-inset-top))}.stage{margin-top:clamp(20px,12vh,90px)}.ribbon{font-size:10px}.meta{font-size:10px;line-height:1.5;flex-wrap:wrap;gap:6px 16px;text-align:center}.controls{width:min(95vw,460px);margin-top:auto;margin-bottom:max(16px,env(safe-area-inset-bottom))}.control{width:72px;height:72px}#jump{width:104px}.touch-name{display:inline;color:#b3cfca;text-align:center;font-size:10px}}
    @media(max-height:480px) and (orientation:landscape){.shell{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:26px 1fr;gap:3px;padding:4px 6px}.ribbon{grid-column:1/-1;grid-row:1;max-width:100%;font-size:9px}.stage{grid-column:2;grid-row:2;max-height:calc(100vh - 40px);width:auto;margin:0}.stage canvas{height:min(calc(100vh - 42px),calc(78vw * 9/16));width:auto;max-width:75vw}.controls{display:contents}.controls .group:first-child{grid-column:1;grid-row:2;justify-self:end;align-self:end;padding-right:9px}.controls .group:last-child{grid-column:3;grid-row:2;justify-self:start;align-self:end;padding-left:9px}.control{width:59px;height:61px;font-size:19px}#jump{width:75px;height:65px;font-size:12px}#pause{width:39px;height:44px}.meta,.touch-name{display:none}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="ribbon"><strong>SKYLARK</strong><span>THE LANTERN TRAIL · ORIGINAL PIXEL ADVENTURE</span><span id="sound-status">♪ ON</span></header>
    <div class="stage"><canvas id="game" width="256" height="144" tabindex="0" role="img" aria-label="Пиксельный платформер: движение стрелками, прыжок Пробел, пауза P"></canvas></div>
    <div class="meta"><span><b>MOVE</b> ← → / A D</span><span><b>JUMP</b> SPACE / ↑ / W / Z</span><span><b>PAUSE</b> P / ESC</span><span id="status">READY</span></div>
    <div class="controls" aria-label="Сенсорное управление">
      <div class="group">
        <button type="button" id="left" class="control" aria-label="Двигаться влево">◀</button>
        <button type="button" id="right" class="control" aria-label="Двигаться вправо">▶</button>
      </div>
      <div class="group">
        <button type="button" id="pause" class="control" aria-label="Пауза">Ⅱ</button>
        <button type="button" id="jump" class="control" aria-label="Прыжок">JUMP ↥</button>
      </div>
    </div>
    <p class="touch-name">Держите направление и прыжок одновременно. Поверните телефон для широкого обзора.</p>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
